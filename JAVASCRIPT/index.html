<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!---
       EXTERNAL JS :-
      The defer attribute tells the browser to download your javascript file in the background while continuing 
       to parse the html document and to execute it only  after the html parsing  it completly finished 
    -->
       
    <script src="./script.js" defer></script>
</head>
<body>
    <h1> Learn JavaScript </h1>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nested Child Page </h1>

    <!-- Open page in parent webpage-->
    <a href="https://www.flipkart.com " target="_parent"> flipkart</a>
    <br>

    <!---Open page in Super most parent webpage-->
    <a href="https://www.amazon.com" target="_top">amazon</a>
    <br>

    <!---Open page in new tab -->
    <a href="https://www.myntra.com" target="_blank">Myntra</a>
</body>
</html>

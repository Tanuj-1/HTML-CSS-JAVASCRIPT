<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    div[class]{
        background-color:red;
    }
    div[class="box2"]{
        background-color:yellow;
    }
    </style>
</head>
<body>
    <h1>Learn attribute Selector</h1>
    <div class="box1">
      Hello World
    </div>
    <div class="box2">
     Hello Universe
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box1{
            height: 200px;
            width: 200px;
            background-color: pink;
            border: 10px solid black;
            padding: 50px;
            box-sizing: content-box;
            margin: 50px 0 0 100px;
            
        }
        .box2{
            height: 200px;
            width: 200px;
            background-color: orange;
            border: 10px solid black;
            padding: 50px;
            box-sizing: content-box;
        }
    </style>
</head>
<body>
    <h1>Learn Box Model</h1>
    <div class="box1"></div>
    <hr />
    <div class="box2"></div>
</body>
</html>
